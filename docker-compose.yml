services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_collab_db
    restart: always
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: ai_collab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
